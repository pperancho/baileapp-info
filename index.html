<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dance Learning Library</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #fff;
      background: #071216;
    }

    main {
      max-width: 650px;
      margin: 24px;
      padding: 40px;
      border: 1px solid #344529;
      border-radius: 20px;
      background: #0c1719;
    }

    h1, a {
      color: #b9f31d;
    }
  </style>
</head>
<body>
  <main>
    <h1>Dance Learning Library</h1>
    <p>Aplicación privada para organizar y estudiar vídeos de baile.</p>

    <p>
      Los datos de tempo musical utilizados por la aplicación son
      proporcionados por
      <a href="https://getsongbpm.com/">GetSongBPM</a>.
    </p>
  </main>
</body>
</html>
